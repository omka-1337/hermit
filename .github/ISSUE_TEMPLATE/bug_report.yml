name: Bug report
description: Something in Hermit does not work
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time. The fields below are the ones that usually decide how fast this can be fixed.
  - type: input
    id: version
    attributes:
      label: Hermit version
      description: Settings → About, or the name of the AppImage.
      placeholder: "0.4.0"
    validations:
      required: true
  - type: dropdown
    id: install
    attributes:
      label: How did you install it?
      options:
        - AppImage from the releases page
        - Built from source
        - Other (say so below)
    validations:
      required: true
  - type: input
    id: system
    attributes:
      label: System and glibc
      description: "Distribution and the first line of `ldd --version`. On a Steam Deck: the SteamOS version."
      placeholder: "SteamOS 3.7.13, glibc 2.41"
    validations:
      required: true
  - type: dropdown
    id: layout
    attributes:
      label: Which layout were you using?
      options:
        - Desktop
        - Steam Deck
        - Steam Deck, in Game Mode
    validations:
      required: true
  - type: input
    id: game
    attributes:
      label: Game
      description: The game and whether it runs through Proton or natively, if the problem involves one.
      placeholder: "Lethal Company, Proton"
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, and what you got instead.
    validations:
      required: true
  - type: textarea
    id: output
    attributes:
      label: Output
      description: |
        Start Hermit from a terminal (`./Hermit-*.AppImage`) and paste what it prints while the problem happens.
        For mods that do not load, the report Hermit shows after a game session is more useful than the whole log.
      render: text
